# -----------------------------------------------------------------------------
# 사이트 기본
# -----------------------------------------------------------------------------

title: 고준서
first_name: 고준서
middle_name:
last_name:
contact_note: >
  이메일이 가장 빠릅니다.
description: >
  백엔드 개발자 고준서. 카카오테크캠퍼스 백엔드 과정 수료, 대학 동아리 지원 서비스 동아리움을 팀에서 10개월 운영하며 통계, 공지, 이메일 알림 전담. 개인 프로젝트로 LLM 학습 서비스와 게임 AI. 코딩 에이전트가 만든 코드를 테스트와 통계로 검증하며 일합니다.
footer_text: ""
keywords: 고준서, 백엔드 개발자, Spring Boot, FastAPI, LLM, 포트폴리오
lang: ko
icon: avatar.png
apple_touch_icon: avatar.png

url: https://gary5876.github.io
baseurl: /portfolio
last_updated: false
impressum_path:
back_to_top: true

# -----------------------------------------------------------------------------
# 테마
# -----------------------------------------------------------------------------

repo_theme_light: default
repo_theme_dark: dark
protect_email: false

repo_trophies:
  enabled: false
  theme_light: flat
  theme_dark: gitdimmed

external_services:
  github_readme_stats_url: https://github-stats-extended.vercel.app
  github_profile_trophy_url: https://github-profile-trophy.vercel.app

# -----------------------------------------------------------------------------
# al-folio API (v1.x)
# -----------------------------------------------------------------------------

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

# -----------------------------------------------------------------------------
# 화면 구성
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: false
search_enabled: true
socials_in_search: true
posts_in_search: true
bib_search: false

max_width: 930px

serve_og_meta: true
serve_schema_org: true
og_image:

# -----------------------------------------------------------------------------
# 분석 도구 (미사용)
# -----------------------------------------------------------------------------

analytics:
  google:
  cronitor:
  pirsch:
  openpanel:
  cloudflare:
enable_simple_analytics: false
google_site_verification:
bing_site_verification:

# -----------------------------------------------------------------------------
# 글
# -----------------------------------------------------------------------------

blog_name: 글
blog_description: 문제 해결, 설계 결정, 공부 노트
permalink: /blog/:year/:month/:day/:title/
lsi: false

pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

giscus:
  repo:
  repo_id:
  category:
  category_id:

disqus_shortname:

newsletter:
  enabled: false
  endpoint:

# 우리 분류 이름(화면 표시용)
category_labels:
  troubleshooting: 문제 해결
  decisions: 설계 결정
  study: 공부 노트

# -----------------------------------------------------------------------------
# 컬렉션
# -----------------------------------------------------------------------------

collections:
  projects:
    output: true
    permalink: /projects/:path/

# -----------------------------------------------------------------------------
# Jekyll
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - AGENTS.md
  - al-folio-upgrade-report.md
  - bin/
  - CLAUDE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - docs/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  - readme_preview/
  - gems/
  - migrations/
  - vendor
  - scripts/
  - node_modules/
keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

  - al_folio_core
  - al_icons
  - al_folio_cv
  - al_folio_distill
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_cookie
  - al_analytics
  - al_citations
  - al_ext_posts
  - al_img_tools
  - al_search
  - al_charts
  - al_math
  - al_comments
  - al_newsletter
  - al_email_protect
  - al_marimo
  - al_rtl

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      mermaid:
        enabled: true
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      mermaid:
        enabled: true

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude: ["robots.txt"]

terser:
  compress:
    drop_console: true

# -----------------------------------------------------------------------------
# 글 보관함(연도, 태그, 분류)
# -----------------------------------------------------------------------------

jekyll-archives:
  posts:
    enabled: [year, tags, categories]
    permalinks:
      year: "/blog/:year/"
      tags: "/blog/:type/:name/"
      categories: "/blog/:type/:name/"

display_tags: []
display_categories: [troubleshooting, decisions, study]

# -----------------------------------------------------------------------------
# Jekyll Scholar (논문 목록 없음, 플러그인 요구 때문에 최소 설정만 둠)
# -----------------------------------------------------------------------------

scholar:
  last_name: [고]
  first_name: [준서]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false

filtered_bibtex_keywords: [abbr, abstract, additional_info, altmetric, annotation, arxiv, award, award_name, bibtex_show, blog, code, dimensions, eprint, google_scholar_id, hal, html, inspirehep_id, pdf, pmid, poster, preview, selected, slides, supp, video, website]
max_author_limit: 3
more_authors_animation_delay: 10
enable_publication_thumbnails: false

# -----------------------------------------------------------------------------
# 외부 링크
# -----------------------------------------------------------------------------

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# 이미지 (ImageMagick 미사용)
# -----------------------------------------------------------------------------

imagemagick:
  enabled: false
  widths: [480, 800, 1400]
  input_directories: [assets/img/]
  input_formats: [".jpg", ".jpeg", ".png", ".tiff", ".gif"]
  output_formats:
    webp: "-auto-orient -quality 85"

lazy_loading_images: true

# -----------------------------------------------------------------------------
# 선택 기능
# -----------------------------------------------------------------------------

enable_google_verification: false
enable_bing_verification: false
enable_cookie_consent: false
enable_masonry: true
enable_math: false
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: false
enable_medium_zoom: false
enable_progressbar: true
enable_video_embedding: false

